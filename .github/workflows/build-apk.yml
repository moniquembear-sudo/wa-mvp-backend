name: Build Floating Bubble APK

on:
  push:
    paths:
      - 'floating-bubble-app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        working-directory: ./floating-bubble-app
        run: npm install

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        working-directory: ./floating-bubble-app/android
        run: chmod +x gradlew

      - name: Build APK (Release)
        working-directory: ./floating-bubble-app/android
        run: ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
           name: floating-bubble-release-apk
           path: floating-bubble-app/android/app/build/outputs/apk/release/app-release.apk
